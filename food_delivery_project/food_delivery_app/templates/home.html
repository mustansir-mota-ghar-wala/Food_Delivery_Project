<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurants</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: #ff4d4d;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .logout {
            color: white;
            text-decoration: none;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            border-radius: 5px;
        }

        .logout:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .container {
            padding: 20px;
        }

        .title {
            margin-bottom: 20px;
        }

        .restaurant-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-body {
            padding: 15px;
        }

        .card-body h3 {
            margin: 0 0 10px 0;
        }

        .category {
            color: gray;
            font-size: 14px;
        }

        .empty {
            color: gray;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <h2>🍔 Food Delivery</h2>
        <a href="{% url 'logout' %}" class="logout">🚪 Logout</a>
    </div>

    <!-- Main Content -->
    <div class="container">
        <h2 class="title">Available Restaurants</h2>

        <div class="restaurant-grid">

            {% for restaurant in restaurants %}
            <div class="card">
                <img src="{{ restaurant.image.url }}" alt="Restaurant Image">

                <div class="card-body">
                    <h3>{{ restaurant.name }}</h3>
                    <p class="category">{{ restaurant.category }}</p>
                </div>
            </div>
            {% empty %}
            <p class="empty">No restaurants available</p>
            {% endfor %}

        </div>
    </div>

</body>

</html>
